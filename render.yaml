services:
  - type: web
    name: merlynsales-ui
    runtime: node
    region: virginia
    plan: starter
    # Vinext is a development dependency required to compile the UI.
    # Explicitly include it even though NODE_ENV is production at runtime.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
